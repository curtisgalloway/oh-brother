#
# macOS release: tag vX.Y.Z -> build the app (arm64) -> Developer ID
# sign -> notarize -> staple -> wrap in a drag-to-Applications DMG ->
# sign + notarize + staple the DMG -> attach it to the tag's GitHub
# Release. Runs alongside release-windows.yml on the same tag;
# whichever finishes first creates the release and the other appends
# its assets (softprops/action-gh-release@v3 semantics).
#
# v0.1.0 shipped an ad-hoc-signed DMG (OH_BROTHER_SIGN_IDENTITY was
# pinned to "-" here) and Gatekeeper rejected it on download. Two
# guards now stand in the way of a repeat: this repo refuses to build a
# release at all without the signing secrets, and the artifacts are run
# past spctl/stapler before they are uploaded.
#
# Required repository secrets:
#   MACOS_CERT_P12            base64 of the "Developer ID Application"
#                             certificate + private key exported as .p12
#   MACOS_CERT_PASSWORD       the .p12 export password
#   MACOS_NOTARY_API_KEY_P8   base64 of the App Store Connect
#                             AuthKey_<KEYID>.p8
#   MACOS_NOTARY_KEY_ID       that key's ID
#   MACOS_NOTARY_ISSUER_ID    the App Store Connect issuer UUID
#
# Forks without these still get a working (ad-hoc, Gatekeeper-flagged)
# build so a clone can cut its own release.

name: release-macos

on:
  push:
    tags: ["v*"]
  # Dry run: exercises build -> sign -> notarize -> staple -> verify and
  # publishes nothing (the release step below is tag-only). Use this to
  # prove the signing secrets work before committing to a version tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # arm64; the app ships aarch64-only
    env:
      # The secrets context is not allowed in step `if`s — it is a parse
      # error that invalidates the whole workflow (hit once already on
      # release-windows.yml). Mirror into env and test that instead.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_API_KEY_P8: ${{ secrets.MACOS_NOTARY_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Require signing secrets on the canonical repo
        if: ${{ github.repository == 'curtisgalloway/oh-brother' && (env.MACOS_CERT_P12 == '' || env.MACOS_NOTARY_API_KEY_P8 == '') }}
        run: |
          echo "::error::Developer ID signing secrets are missing — refusing to publish an unsigned macOS release. See this workflow's header for the five secrets required."
          exit 1

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          # build.sh discovers the identity via `security find-identity`,
          # which only searches the keychain search list.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning

      # With a certificate imported, OH_BROTHER_SIGN_IDENTITY stays
      # unset and build.sh auto-detects the Developer ID. Without one,
      # pin it to ad-hoc so the fallback is explicit rather than a
      # silent side effect of an empty keychain.
      - name: Select ad-hoc signing (no certificate available)
        if: ${{ env.MACOS_CERT_P12 == '' }}
        run: echo "OH_BROTHER_SIGN_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: sh macos/build.sh

      - name: Notarize and staple the app
        if: ${{ env.MACOS_NOTARY_API_KEY_P8 != '' }}
        env:
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$MACOS_NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "macos/build/Oh Brother.app" "$RUNNER_TEMP/app.zip"
          sh macos/notarize.sh "$RUNNER_TEMP/app.zip" "macos/build/Oh Brother.app"

      # Packs the app as it now stands — ticket included.
      - name: Pack and sign the DMG
        run: sh macos/build.sh pack-dmg

      - name: Notarize and staple the DMG
        if: ${{ env.MACOS_NOTARY_API_KEY_P8 != '' }}
        env:
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$MACOS_NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          DMG="$(ls macos/build/*.dmg)"
          sh macos/notarize.sh "$DMG" "$DMG"
          rm -f "$RUNNER_TEMP/notary.p8"

      # The check that v0.1.0 lacked: inspect the exact bytes that are on
      # their way to the Release page, rather than assuming the build
      # steps did what they claimed.
      - name: Verify the artifacts are Developer ID signed
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          APP="macos/build/Oh Brother.app"
          DMG="$(ls macos/build/*.dmg)"
          INFO="$(codesign -dvv "$APP" 2>&1)"
          echo "$INFO"
          case "$INFO" in
            *"TeamIdentifier=not set"*)
              echo "::error::$APP is ad-hoc signed, not Developer ID signed"
              exit 1
              ;;
          esac
          case "$INFO" in
            *"flags=0x10000(runtime)"*) ;;
            *)
              echo "::error::$APP lacks the hardened runtime; notarization will reject it"
              exit 1
              ;;
          esac
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$DMG"

      # Split from the step above because spctl and stapler only pass
      # once a ticket exists — a Developer ID build that has not been
      # through the notary service is still "rejected".
      - name: Verify Gatekeeper accepts the artifacts
        if: ${{ env.MACOS_CERT_P12 != '' && env.MACOS_NOTARY_API_KEY_P8 != '' }}
        run: |
          APP="macos/build/Oh Brother.app"
          DMG="$(ls macos/build/*.dmg)"
          spctl -a -vvv -t exec "$APP"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: macos/build/*.dmg
          # This job owns the release notes; release-windows.yml only
          # attaches artifacts, so they are not generated twice.
          #
          # These notes are the auto-generated PR changelog, and they
          # replace the tag's annotation rather than appending to it —
          # so a hand-written message on the tag will NOT appear here.
          # For notes that matter to downloaders (e.g. the SmartScreen
          # warning on the unsigned Windows installers), edit the release
          # after the run: gh release edit vX.Y.Z --notes-file notes.md
          generate_release_notes: true
