#
# Windows release pipeline: tag vX.Y.Z -> build workspace -> MSI ->
# (optionally sign via Azure Artifact Signing) -> Burn bundle ->
# GitHub Release -> winget-pkgs update PR.
#
# Signing is OFF until the Azure resources exist (see
# windows/INSTALLER-PLAN.md). To turn it on, define these VARIABLES on
# the repo or the `release` environment:
#   vars.AZURE_SIGNING_ENDPOINT  region URI, e.g.
#                                https://wus2.codesigning.azure.net
#   vars.AZURE_SIGNING_ACCOUNT   Artifact Signing account name
#   vars.AZURE_SIGNING_PROFILE   certificate profile name
# plus these `release`-environment SECRETS, consumed by azure/login:
#   secrets.AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
# While AZURE_SIGNING_ACCOUNT is unset every signing step skips and
# the workflow ships unsigned artifacts, exactly as before.
#
# Auth is OIDC, so no long-lived credential is stored. That needs
# `id-token: write` below AND a federated identity credential in Entra
# whose subject matches this job exactly:
#   repo:curtisgalloway@4055365/oh-brother@1335543057:environment:release
# A subject mismatch fails the token exchange with no error message on
# either side. Confirm the real subject with oidc-probe.yml before
# tagging a release rather than assuming the format.
#
# `environment: release` is what puts `:environment:` in that subject.
# It also means every Windows release now waits for the environment's
# required-reviewer approval before it builds — the approval gate sits
# in front of the whole job, not just the signing steps, because
# signing is interleaved with the build and can't be split out without
# reintroducing artifact round-trips.
#
# Signing happens in place on the runner (three signtool calls), which
# is why the old upload-artifact / download / swap-in dance is gone.
# Note that actionlint does NOT validate third-party action inputs
# (verified: it ignores an invented input on this action), so a rename
# surfaces only at signing time. The inputs below were read from
# artifact-signing-action v2.0.0's action.yml, not from its README.
#
# winget publishing similarly waits on secrets.WINGET_TOKEN (a classic
# PAT with public_repo scope; winget-releaser uses it to fork/PR
# microsoft/winget-pkgs). The FIRST version must be submitted by hand
# (wingetcreate or komac) to create the package; the action only
# updates existing packages.

name: release-windows

on:
  push:
    tags: ["v*"]
  # Dry run: exercises build -> sign MSI -> bundle -> sign engine ->
  # sign bundle -> verify, and publishes nothing (the release step and
  # the winget job are both tag-only). Use this to prove the Azure
  # signing setup works before committing to a version tag — same
  # pattern as release-macos.yml.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Build workspace
        run: cargo build --release --manifest-path rust\Cargo.toml

      - name: Install WiX v7 CLI
        run: dotnet tool install --global wix

      # WiX v7 refuses to run until its Open Source Maintenance Fee
      # EULA is accepted (error WIX7015, found on first real build).
      # oh-brother is fee-exempt — no revenue; analysis in
      # windows/INSTALLER-PLAN.md.
      - name: Accept WiX OSMF EULA
        run: wix eula accept wix7

      - name: Build MSI
        run: windows\build.ps1 msi -NoCargo

      # The signing action's `files` input wants absolute paths and the
      # MSI name carries the version, so resolve both once here and
      # reuse them rather than re-globbing in every later step.
      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem windows/build/*.msi | Select-Object -First 1
          $ver = $msi.BaseName -replace '^OhBrother-','' -replace '-x64$',''
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      # ---- Signing (every step skips until the Azure vars are set) ----
      # allow-no-subscriptions, and no subscription-id, on purpose. The
      # signing identity holds only Artifact Signing Certificate Profile
      # Signer scoped to the certificate profile: that grants data-plane
      # signing but no subscription-scope role, so the CLI enumerates
      # zero subscriptions and an ordinary login dies with "No
      # subscriptions found for ***" (observed on the first dry run,
      # after the OIDC exchange itself succeeded). Signing talks to the
      # codesigning endpoint rather than ARM, so a tenant-level login is
      # sufficient — and asking for one avoids giving a signing-only
      # identity standing Reader over the whole subscription.
      #
      # Dropping subscription-id also sidesteps Azure/login#592, an
      # intermittent failure with this same message when an explicit
      # subscription-id is passed with OIDC.
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # timestamp-rfc3161 has a default in v2.0.0, but it is set
      # explicitly here on purpose: Artifact Signing certificates live
      # 72 hours, so an untimestamped signature verifies on release day
      # and goes invalid three days later. That must not depend on a
      # third-party action's default staying put.
      - name: Sign MSI
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.msi.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Build the bundle around whichever MSI is now in windows\build
      # (signed if the step above ran, unsigned otherwise). Invokes wix
      # directly rather than build.ps1 bundle because build.ps1 wipes
      # build\, which would discard the signed MSI.
      - name: Build Burn bundle
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi.outputs.path }}
          MSI_VERSION: ${{ steps.msi.outputs.version }}
        run: |
          wix extension add --global WixToolset.Util.wixext/7.0.0
          wix extension add --global WixToolset.BootstrapperApplications.wixext/7.0.0
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile windows/build/MicrosoftEdgeWebView2Setup.exe
          wix build -arch x64 `
            -ext WixToolset.Util.wixext/7.0.0 -ext WixToolset.BootstrapperApplications.wixext/7.0.0 `
            -d "Version=$($env:MSI_VERSION)" -d "Msi=$($env:MSI_PATH)" `
            -d "WindowsDir=$PWD\windows" `
            -d "WebView2Bootstrapper=$PWD\windows\build\MicrosoftEdgeWebView2Setup.exe" `
            windows/installer/Bundle.wxs -o "windows/build/OhBrother-$($env:MSI_VERSION)-x64-setup.exe"

      # ---- Bundle signing: Burn engine first, then the bundle ----
      # Burn hides its engine inside the bundle, so the engine has to be
      # detached, signed, and reattached before the finished bundle is
      # signed. Three signtool calls per release, all in place.
      #
      # The globs deliberately stay narrow: windows\build also holds
      # MicrosoftEdgeWebView2Setup.exe, which is Microsoft's binary and
      # must never be re-signed with this certificate. It has no hyphen
      # before "Setup", so *-setup.exe does not match it.
      - name: Detach Burn engine
        id: detach
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $bundle = Get-ChildItem windows/build/*-setup.exe | Select-Object -First 1
          wix burn detach $bundle.FullName -engine windows/build/engine.exe
          "bundle=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          "engine=$((Get-Item windows/build/engine.exe).FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign Burn engine
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.detach.outputs.engine }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Reattach signed engine
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          BUNDLE: ${{ steps.detach.outputs.bundle }}
          ENGINE: ${{ steps.detach.outputs.engine }}
        run: wix burn reattach "$($env:BUNDLE)" -engine "$($env:ENGINE)"

      - name: Sign bundle
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.detach.outputs.bundle }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Confirm the signing actually landed, rather than trusting that
      # it did. The macOS release shipped ad-hoc signed precisely
      # because nothing inspected the finished artifact.
      #
      # The timestamp assertion is not decoration. Signing certificates
      # here are valid for 72 hours, so a signature without an RFC3161
      # countersignature passes Get-AuthenticodeSignature on release day
      # and every installer in the wild goes invalid three days later —
      # a failure nobody would notice until users report it.
      - name: Verify artifacts are signed and timestamped
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows/build/*.msi, windows/build/*-setup.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($_.Name) is not validly signed (status: $($sig.Status))"
              $failed = $true
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($_.Name) has no RFC3161 timestamp; its signature dies with the 72-hour certificate"
              $failed = $true
            } else {
              Write-Host "  timestamped by: $($sig.TimeStamperCertificate.Subject)"
            }
          }
          if ($failed) { exit 1 }

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            windows/build/*.msi
            windows/build/*-setup.exe
          # Deliberately NOT generate_release_notes. Both release
          # workflows run on the same tag and whichever finishes second
          # appends a second copy — v0.1.0 shipped with "What's Changed"
          # twice. release-macos.yml owns the notes; this job only
          # attaches its artifacts.

  winget:
    needs: build
    runs-on: ubuntu-latest
    # Tag-only, so a workflow_dispatch dry run never touches winget.
    # Also skips prereleases like v0.2.0-rc.1; no-op until WINGET_TOKEN
    # exists and the package's first version was submitted manually.
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    env:
      # The secrets context is not allowed in step `if`s (a parse
      # error that invalidates the whole workflow) — test via env.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Publish to winget (update PR)
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: CurtisGalloway.OhBrother
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Skipped (no WINGET_TOKEN)
        if: ${{ env.WINGET_TOKEN == '' }}
        run: echo "WINGET_TOKEN not set — skipping winget publish. See windows/INSTALLER-PLAN.md."
