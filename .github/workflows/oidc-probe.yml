#
# Throwaway diagnostic: prints the `sub` claim of the OIDC token this
# repo actually issues, so the Entra federated identity credential can
# be built to match it exactly.
#
# Why measure instead of infer: GitHub applies the immutable subject
# format (repo:<owner>@<owner_id>/<repo>@<repo_id>:...) automatically
# to repos created on or after 2026-07-15, but this repo's OIDC
# settings still report use_immutable_subject=false while
# sub_claim_prefix already shows the immutable form. Those two signals
# disagree, and a subject mismatch fails the Entra token exchange with
# NO error message on either side — so read the real value here rather
# than guess which format applies.
#
# `environment: release` is load-bearing. Without it the token carries
# a ref:-based subject and you would configure the credential against
# the wrong string.
#
# Run it from the Actions tab (workflow_dispatch), copy the `sub` it
# prints into the federated credential, and delete this file once
# release-windows.yml has authenticated successfully once.

name: oidc-probe

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Prints three selected claims and never the token itself: the
      # token is a live credential and this repository's logs public.
      - name: Print OIDC subject claim
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "$payload" | base64 -d | jq '{sub, repository_id, repository_owner_id}'
