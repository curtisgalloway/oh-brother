[package]
name = "label-render"
description = "Label renderer (phase-3 Rust port of render.py)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2"
dirs = "6"
image = "0.25"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
sha2 = "0.10"
skera = "0.6"
ttf-parser = "0.25"
ureq = "3"
write-fonts = { version = "0.52", features = ["read"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
