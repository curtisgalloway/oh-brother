[package]
name = "label-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native shell window around the label-web UI (the Windows app; also runs on macOS/Linux for development)"

[[bin]]
name = "label-app"
path = "src/main.rs"

[dependencies]
tao = "0.36"
wry = "0.56"
muda = "0.19"
rfd = "0.15"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
