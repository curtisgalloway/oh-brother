[package]
name = "pt-protocol"
description = "Brother P-touch raster protocol over USB and Bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Vendored: libusb is compiled in statically, so shipped binaries have
# no Homebrew/system dependency.
rusb = { version = "0.9", features = ["vendored"] }
