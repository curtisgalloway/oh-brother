[package]
name = "label-cli"
description = "Print labels on Brother P-touch printers (phase-1 Rust CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "label"
path = "src/main.rs"

[dependencies]
pt-protocol = { path = "../pt-protocol" }
label-render = { path = "../label-render" }
clap = { version = "4", features = ["derive"] }
image = "0.25"
tempfile = "3"
